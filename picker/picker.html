<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HTML Slides Picker</title>
<style>
  :root { --bg:#10131a; --panel:#171b25; --line:#2a3140; --text:#e8ebf2; --dim:#96a0b5;
          --accent:#6ea8ff; --ok:#4fd6a2; --bad:#ff7a7a; }
  * { box-sizing: border-box; margin: 0; }
  body { background:var(--bg); color:var(--text); font:14px/1.45 "Segoe UI", system-ui, sans-serif;
         height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:10px; padding:12px 18px;
           background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; font-weight:600; letter-spacing:.4px; }
  .badge { font-size:11px; color:var(--dim); }
  header .from-opencode { font-size:11px; color:var(--ok); display:none;
                          border:1px solid var(--ok); border-radius:20px; padding:2px 10px; }
  main { display:flex; flex:1; min-height:0; }
  #rail { width:360px; flex-shrink:0; border-right:1px solid var(--line); background:var(--panel);
          padding:12px 14px; overflow-y:auto; }
  #rail h2 { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin:12px 0 6px; }
  .side-actions { display:flex; gap:10px; margin-top:14px; }
  .side-actions button { flex:1; }
  .side-rule { border:0; border-top:1px solid var(--line); margin:14px 0 10px; }
  #rail input[type=search] { width:100%; background:var(--bg); color:var(--text);
                             border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-size:13px; }
  #rail label.chip { display:block; font-size:12px; padding:3px 0; cursor:pointer; }
  .count { font-size:11px; color:var(--dim); margin-top:8px; }
  #grid { flex:1; overflow-y:auto; padding:16px;
          display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
          gap:14px; align-content:start; }
  .card { background:var(--panel); border:2px solid transparent; border-radius:10px;
          overflow:hidden; cursor:pointer; }
  .card img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:#000; }
  .card .meta { padding:8px 10px; }
  .card .name { font-weight:600; font-size:13px; }
  .card .tag { font-size:11px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card.sel { border-color:var(--accent); }
  .card.sel .name::after { content:"  ✓"; color:var(--ok); }
  #ribbon { font-size:12px; margin-bottom:10px; }
  #ribbon b { color:var(--accent); }
  .row { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field span { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); }
  .field input[type=number], .field select { background:var(--bg); color:var(--text);
      border:1px solid var(--line); border-radius:6px; padding:6px 10px; width:120px; }
  #content_files { width:100%; height:64px; background:var(--bg); color:var(--text);
      border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:12px monospace; }
  #content_files.bad { border-color:var(--bad); }
  #content_files.drop-hover { border-color:var(--accent); box-shadow:0 0 0 2px rgba(110,168,255,.35); }
  button.mini { margin-top:6px; padding:6px 12px; font-size:12px; background:transparent;
                color:var(--accent); border:1px solid var(--line); }
  button.mini:disabled { opacity:.4; cursor:not-allowed; }
  .hint { font-size:11px; color:var(--dim); overflow-wrap:anywhere; }
  #notes { width:100%; background:var(--bg); color:var(--text);
           border:1px solid var(--line); border-radius:6px; padding:6px 10px; }
  button { border:0; border-radius:8px; padding:10px 18px; font-size:13px; font-weight:600; cursor:pointer; }
  #copyBtn { background:transparent; color:var(--dim); border:1px solid var(--line); }
  #buildBtn { background:var(--accent); color:#0a0e18; }
  #buildBtn:disabled { opacity:.4; cursor:not-allowed; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--panel);
           border:1px solid var(--line); padding:10px 16px; border-radius:8px; font-size:13px; display:none; }
  #shotModal { position:fixed; inset:0; background:rgba(6,9,15,.78); display:none;
               align-items:center; justify-content:center; z-index:1000; }
  #shotModal.open { display:flex; }
  .shots-panel { background:var(--panel); border:1px solid var(--line); border-radius:12px;
                 padding:16px; max-width:86vw; }
  .shots-head { display:flex; align-items:baseline; gap:10px; margin-bottom:10px; }
  .shots-head b { font-size:14px; }
  .shots-head span { font-size:11px; color:var(--dim); }
  .shots-head button { margin-left:auto; background:transparent; color:var(--dim);
                       border:0; cursor:pointer; font-size:16px; padding:2px 6px; }
  .shots-row { display:flex; gap:10px; }
  .shots-row img { width:32%; aspect-ratio:16/9; object-fit:cover; background:#000;
                   border-radius:8px; display:block; }
  .shots-foot { display:flex; justify-content:flex-end; margin-top:12px; }
</style>
</head>
<body>
<header>
  <h1>HTML SLIDES — Lesson Deck Picker</h1>
  <span class="from-opencode" id="fromOpencode">waiting for your submission (opencode is watching)</span>
</header>
<main>
  <nav id="rail">
    <input id="q" type="search" placeholder="Search templates">
    <h2>Scheme</h2><div data-filter="scheme"></div>
    <h2>Density</h2><div data-filter="density"></div>
    <h2>Formality</h2><div data-filter="formality"></div>
    <div class="count" id="count"></div>
    <h2>Deck options</h2>
    <div class="row">
      <div class="field"><span>Slide count</span>
        <div class="row">
          <label><input id="autoCount" type="checkbox"> auto</label>
          <input id="countN" type="number" min="3" max="30" value="12" disabled>
        </div>
      </div>
      <div class="field"><span>Density</span>
        <select id="density">
          <option value="auto">auto</option><option value="sparse">sparse</option>
          <option value="balanced" selected>balanced</option><option value="dense">dense</option>
        </select>
      </div>
    </div>
    <div class="field" style="margin-top:8px"><span>Content files (one absolute path per line)</span>
      <textarea id="content_files" placeholder="D:\lessons\Week-1-Notebook.html"></textarea>
      <button id="browseBtn" type="button" class="mini">Browse… (native dialog)</button>
      <div id="outDir" class="hint"></div>
    </div>
    <div class="field" style="margin-top:8px"><span>Extra notes (optional)</span>
      <input id="notes" placeholder="e.g. keep section dividers minimal">
    </div>
    <hr class="side-rule">
    <div id="ribbon">Select a template to begin.</div>
    <span class="badge" id="json-library-badge"></span>
    <div class="side-actions">
      <button id="copyBtn">Copy selection</button>
      <button id="buildBtn" disabled>BUILD DECK</button>
    </div>
  </nav>
  <section id="grid"></section>
</main>
<div id="shotModal">
  <div class="shots-panel" role="dialog" aria-modal="true">
    <div class="shots-head"><b id="modalName"></b><span id="modalTag"></span>
      <button id="modalClose" title="Close (Esc)">✕</button></div>
    <div class="shots-row">
      <img data-modal-shot=1 alt="slide 1"><img data-modal-shot=2 alt="slide 2"><img data-modal-shot=3 alt="slide 3">
    </div>
    <div class="shots-foot"><button id="modalSelect">SELECT</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="library.json.js"></script>
<script>
(function () {
    const T = window.LIBRARY.templates;
    const $ = s => document.querySelector(s);
    const grid = $('#grid'), rail = $('#rail');

    $('#json-library-badge').textContent =
        'templates: ' + T.length + ' · library refreshed ' + window.LIBRARY.updated_at.slice(0, 10);
    if (new URLSearchParams(location.search).get('from') === 'opencode')
        $('#fromOpencode').style.display = 'inline-block';

    let recalled = localStorage.getItem('picker.lastTemplate') || '';
    let lastOutputDir = null;

    function updateOutDirUI() {
        $('#outDir').textContent = lastOutputDir ? '.deck will be saved in: ' + lastOutputDir : '';
    }

    // filters: value lists derived from data (occasion removed from UI, kept in data);
    // scheme/density/formality only
    const values = k => [...new Set(
        T.map(t => Array.isArray(t[k]) ? t[k] : (t[k] == null ? [] : [t[k]]))
            .flat().filter(Boolean).sort())];
    for (const k of ['scheme', 'density', 'formality']) {
        const box = rail.querySelector('[data-filter="' + k + '"]');
        for (const v of values(k)) {
            const lab = document.createElement('label');
            lab.className = 'chip';
            const cb = document.createElement('input');
            cb.type = 'checkbox'; cb.dataset.k = k; cb.value = v;
            lab.appendChild(cb);
            lab.appendChild(document.createTextNode(' ' + v));
            box.appendChild(lab);
        }
    }

    function activeFilters() {
        const f = {};
        rail.querySelectorAll('input[type=checkbox]:checked')
            .forEach(c => { (f[c.dataset.k] = f[c.dataset.k] || []).push(c.value); });
        return f;
    }

    function passes(t, f, q) {
        if (q && !((t.name + ' ' + t.tagline).toLowerCase().includes(q))) return false;
        for (const k of ['scheme', 'density', 'formality'])
            if (f[k] && !f[k].includes(t[k])) return false;
        return true;
    }

    function cards() {
        const q = $('#q').value.trim().toLowerCase();
        const f = activeFilters();
        grid.innerHTML = '';
        let n = 0;
        for (const t of T) {
            if (!passes(t, f, q)) continue;
            const c = document.createElement('div');
            c.className = 'card' + (t.slug === recalled ? ' sel' : '');
            c.dataset.templateCard = t.slug;
            const img = document.createElement('img');
            img.loading = 'lazy';
            img.src = 'screenshots/' + encodeURIComponent(t.slug) + '-1.png';
            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.innerHTML = '<div class="name"></div><div class="tag"></div>';
            meta.querySelector('.name').textContent = t.name;
            meta.querySelector('.tag').textContent = t.tagline;
            c.appendChild(img); c.appendChild(meta);
            c.onclick = () => openShotModal(t.slug);
            grid.appendChild(c);
            n++;
        }
        $('#count').textContent = n + ' / ' + T.length;
    }

    function ribbon() {
        const t = T.find(x => x.slug === recalled);
        const r = $('#ribbon');
        if (t) { r.innerHTML = 'SELECTED: <b></b> — <span></span>'; r.querySelector('b').textContent = t.name; r.querySelector('span').textContent = t.tagline; }
        else r.textContent = 'Select a template to begin.';
    }

    const PATH_RE = /^[a-zA-Z]:\\.*/;
    const isPathLike = line => PATH_RE.test(line.trim()) || line.trim().startsWith('\\\\') || line.trim().startsWith('staged:');
    function paths() { return $('#content_files').value.split(/\r?\n/).map(s => s.trim()).filter(Boolean); }
    function revalidate() {
        const list = paths();
        const bad = list.length > 0 && list.some(p => !isPathLike(p));
        $('#content_files').classList.toggle('bad', bad);
        if (list.length === 0 && lastOutputDir) { lastOutputDir = null; updateOutDirUI(); }
        $('#buildBtn').disabled = !(recalled && list.length > 0 && !bad);
    }
    $('#content_files').addEventListener('input', revalidate);

    // drag-and-drop: files dragged from Explorer arrive with file:// URIs -> absolute Windows paths
    const PathDroppables = () => {
        const el = $('#content_files');
        el.parentElement.addEventListener('dragenter', e => { e.preventDefault(); el.classList.add('drop-hover'); });
        el.parentElement.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drop-hover'); });
        el.parentElement.addEventListener('dragleave', e => { if (e.target === el.parentElement) el.classList.remove('drop-hover'); });
        el.parentElement.addEventListener('drop', e => {
            e.preventDefault(); e.stopPropagation();
            el.classList.remove('drop-hover');
            const uris = (e.dataTransfer.getData('text/uri-list') || '').split(/\r?\n/).filter(u => u && u[0] !== '#');
            const used = new Set(paths());
            let added = 0;
            for (const u of uris) {
                if (!u.startsWith('file://')) continue;
                let p = decodeURIComponent(u.slice(7)).replace(/^\/([A-Za-z]:)/, '$1').replace(/\/$/, '').replace(/\//g, '\\');
                if (!p || used.has(p)) continue;
                used.add(p); added++;
                el.value += (el.value && !el.value.endsWith('\n') ? '\n' : '') + p;
            }
            if (added) { revalidate(); toast('added ' + (added === 1 ? 'file path' : added + ' file paths')); }
            else if (e.dataTransfer.files.length) {
                toast('browser hid the path for that drop — use the Browse button instead', true);
            }
        });
    };
    PathDroppables();
    $('#autoCount').onchange = () => { $('#countN').disabled = $('#autoCount').checked; };

    function payload() {
        const p = {
            template: recalled,
            slide_count: $('#autoCount').checked ? 'auto' : Math.min(30, Math.max(3, Number($('#countN').value) || 12)),
            density: $('#density').value,
            content_files: paths(),
            notes: $('#notes').value.trim()
        };
        if (lastOutputDir) p.output_dir = lastOutputDir;
        p.generated_at = new Date().toISOString();
        return p;
    }
    function toast(msg, long) {
        const t = $('#toast');
        t.textContent = msg; t.style.display = 'block';
        clearTimeout(t._h);
        t._h = setTimeout(() => { t.style.display = 'none'; }, long ? 8000 : 3000);
    }

    function pollHelper(ts, maxTries) {
        return new Promise(resolve => {
            let tries = 0;
            function retry() {
                if (++tries >= maxTries) { resolve(null); return; }
                setTimeout(tick, 800);
            }
            function tick() {
                const s = document.createElement('script');
                s.src = 'dialog-result.js?ts=' + ts + '&n=' + Date.now();   // unique URL: fresh file read every tick
                window.DIALOG_RESULT = null;
                s.onerror = () => { s.remove(); retry(); };
                s.onload = () => {
                    s.remove();
                    const r = window.DIALOG_RESULT;
                    window.DIALOG_RESULT = null;
                    if (r && String(r.ts) === String(ts)) { resolve(r); return; }
                    retry();
                };
                document.head.appendChild(s);
            }
            tick();
        });
    }
    async function writeJson() {
        const text = JSON.stringify(payload(), null, 2);
        const ts = Date.now();
        try {
            await navigator.clipboard.writeText(text);
        } catch (e) {
            toast('clipboard blocked — use COPY SELECTION and paste into picker\\selection.json', true);
            return;
        }
        try { location.href = 'slidespicker:save?ts=' + ts; } catch (e) { /* poll anyway */ }
        const res = await pollHelper(ts, 100);
        if (!res) { toast('helper did not answer — JSON is on the clipboard; paste it into picker\\selection.json', true); return; }
        if (!res.saved) { toast('save failed: ' + (res.error || 'unknown reason') + ' — JSON is on the clipboard', true); return; }
        toast('✓ sent to selection.json');
        finish();
    }
    async function browseFiles() {
        const btn = $('#browseBtn');
        if (btn.disabled) return;
        btn.disabled = true;
        const ts = Date.now();
        window.DIALOG_RESULT = null;
        try { location.href = 'slidespicker:pick?ts=' + ts; } catch (e) { /* poll anyway */ }
        const res = await pollHelper(ts, 150);
        btn.disabled = false;
        if (!res) { toast('no dialog answer — native helper not running; type or paste paths instead', true); return; }
        if (res.cancelled) { toast('dialog closed without choosing files'); return; }
        if (!(res.ok && res.paths && res.paths.length)) { toast('no files selected' + (res.error ? ' (' + res.error + ')' : ''), true); return; }
        const el = $('#content_files');
        const used = new Set(paths());
        const fresh = res.paths.filter(p => !used.has(p));
        if (fresh.length) {
            if (el.value && !el.value.endsWith('\n')) el.value += '\n';
            el.value += fresh.join('\n');
        }
        if (res.dir) { lastOutputDir = res.dir; updateOutDirUI(); }
        revalidate();
        toast('added ' + fresh.length + ' file path' + (fresh.length === 1 ? '' : 's'));
    }
    function finish() {
        if (new URLSearchParams(location.search).get('from') === 'opencode')
            toast('opencode is reading selection.json — you can keep this open or close it', true);
    }

    function confirmSelect(slug) {
        recalled = slug;
        localStorage.setItem('picker.lastTemplate', slug);
    cards(); ribbon(); revalidate(); updateOutDirUI();
    }
    function openShotModal(slug) {
        const t = T.find(x => x.slug === slug);
        $('#modalName').textContent = t.name;
        $('#modalTag').textContent  = t.tagline;
        document.querySelectorAll('[data-modal-shot]').forEach(img => {
            img.src = 'screenshots/' + encodeURIComponent(slug) + '-' + img.dataset.modalShot + '.png';
        });
        const sel = $('#modalSelect');
        sel.onclick = () => { closeShotModal(); confirmSelect(slug); };
        $('#shotModal').classList.add('open');
    }
    function closeShotModal() { $('#shotModal').classList.remove('open'); }
    $('#modalClose').onclick = closeShotModal;
    $('#shotModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeShotModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeShotModal(); });

    $('#buildBtn').onclick = writeJson;
    $('#browseBtn').onclick = browseFiles;
    $('#copyBtn').onclick = async () => {
        await navigator.clipboard.writeText(JSON.stringify(payload(), null, 2));
        toast('selection JSON copied');
    };

    cards(); ribbon(); revalidate();
})();
</script>
</body>
</html>
